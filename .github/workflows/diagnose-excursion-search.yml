name: Diagnose Excursion Search

on:
  push:
    paths:
      - ".github/workflows/diagnose-excursion-search.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .tg_session_cache
          key: excursion-diagnostic-${{ github.run_id }}
          restore-keys: |
            vabkhazii-tg-session-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet telethon pynacl
      - name: Resolve Telegram session
        env:
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          TG_SESSION_FALLBACK: ${{ secrets.TG_SESSION }}
        run: python resolve_tg_session.py
      - name: Diagnose excursion queries
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          LEADS_CHAT_ID: ${{ secrets.LEADS_CHAT_ID }}
          LEADS_UNIT_TEST: "1"
        run: |
          python - <<'PY'
          import asyncio, json, os
          from collections import Counter, defaultdict
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          import lead_bot

          QUERIES = list(lead_bot.PRIORITY_EXCURSION_SEARCH_QUERIES)
          CUTOFF = datetime.now(timezone.utc) - timedelta(hours=lead_bot.MAX_AGE_HOURS)

          async def main():
              client=TelegramClient(
                  StringSession(os.environ["TG_SESSION"]),
                  int(os.environ["TG_API_ID"]),
                  os.environ["TG_API_HASH"],
              )
              await client.connect()
              rows=[]
              totals=Counter()
              chat_counts=Counter()
              reasons=Counter()
              try:
                  for q in QUERIES:
                      row=Counter()
                      seen=set()
                      try:
                          async for msg in client.iter_messages(None, search=q, limit=lead_bot.SEARCH_LIMIT):
                              row["returned"] += 1
                              msg_id=(getattr(msg,"chat_id",None), getattr(msg,"id",None))
                              if msg_id in seen:
                                  continue
                              seen.add(msg_id)
                              dt=getattr(msg,"date",None)
                              if dt and dt.tzinfo is None:
                                  dt=dt.replace(tzinfo=timezone.utc)
                              if not dt or dt < CUTOFF:
                                  row["old"] += 1
                                  continue
                              row["fresh"] += 1
                              chat=await msg.get_chat()
                              title=(getattr(chat,"title",None) or "")
                              username=(getattr(chat,"username",None) or "")
                              source=f"GLOBAL:{title} (@{username})"
                              text=(getattr(msg,"message",None) or "").strip()
                              result,reason=lead_bot.classify_lead_detailed(text, source_context=source)
                              if result:
                                  row["accepted"] += 1
                                  row[result.get("temperature","unknown")] += 1
                                  chat_counts[username or title] += 1
                              else:
                                  reasons[reason or "unclassified"] += 1
                                  row["filtered"] += 1
                      except Exception as exc:
                          row["errors"] += 1
                          row["error_type"]=type(exc).__name__
                      rows.append({"query":q, **dict(row)})
                      totals.update({k:v for k,v in row.items() if isinstance(v,int)})
                  report={
                      "priority_excursion_queries":len(QUERIES),
                      "search_limit_per_query":lead_bot.SEARCH_LIMIT,
                      "max_age_hours":lead_bot.MAX_AGE_HOURS,
                      "totals":dict(totals),
                      "filter_reasons":reasons.most_common(20),
                      "top_accepted_chats":chat_counts.most_common(30),
                      "queries":rows,
                  }
                  Path(".ci-status").mkdir(exist_ok=True)
                  Path(".ci-status/excursion-search-diagnostic.json").write_text(
                      json.dumps(report,ensure_ascii=False,indent=2),
                      encoding="utf-8",
                  )
              finally:
                  await client.disconnect()

          asyncio.run(main())
          PY
      - name: Publish diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-status/excursion-search-diagnostic.json
          git commit -m "Record excursion search diagnostic" || exit 0
          git push
