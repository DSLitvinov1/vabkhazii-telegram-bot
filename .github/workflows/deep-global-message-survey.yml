name: Deep Global Telegram Message Survey

on:
  push:
    paths:
      - ".github/workflows/deep-global-message-survey.yml"

permissions:
  contents: write

concurrency:
  group: vabkhazii-deep-global-survey
  cancel-in-progress: true

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .tg_session_cache
          key: deep-global-survey-${{ github.run_id }}
          restore-keys: |
            vabkhazii-tg-session-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet telethon pynacl
      - name: Resolve Telegram session
        env:
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          TG_SESSION_FALLBACK: ${{ secrets.TG_SESSION }}
        run: python resolve_tg_session.py
      - name: Survey global public messages
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          LEADS_CHAT_ID: ${{ secrets.LEADS_CHAT_ID }}
          LEADS_UNIT_TEST: "1"
        run: |
          python - <<'PY'
          import asyncio, json, os
          from collections import defaultdict
          from pathlib import Path

          from telethon import TelegramClient
          from telethon.errors import FloodWaitError
          from telethon.sessions import StringSession
          import lead_bot

          QUERIES = [
              "Абхазия экскурсия",
              "Абхазия экскурсии",
              "Абхазия гид",
              "Абхазия экскурсовод",
              "Абхазия индивидуальная экскурсия",
              "Абхазия куда съездить",
              "Абхазия куда поехать",
              "Абхазия что посмотреть",
              "Абхазия что посетить",
              "Абхазия с детьми куда",
              "Абхазия экскурсия завтра",
              "Абхазия экскурсия сегодня",
              "Абхазия посоветуйте экскурсию",
              "Абхазия какие экскурсии",
              "Абхазия где взять экскурсию",
              "Абхазия нужен гид",
              "Абхазия ищу гида",
              "Абхазия ищем экскурсию",
              "Абхазия можно присоединиться экскурсия",
              "Рица экскурсия",
              "Рица завтра",
              "Рица кто возит",
              "Рица как попасть",
              "Рица из Гагры",
              "Рица из Пицунды",
              "Рица из Сухума",
              "Мзы экскурсия",
              "Мзы как попасть",
              "Мзы из Гагры",
              "Акармара экскурсия",
              "Акармара как попасть",
              "Восточная Абхазия экскурсия",
              "Восточная Абхазия что посмотреть",
              "Ткуарчал экскурсия",
              "Черниговка экскурсия",
              "Кындыг экскурсия",
              "Гегский водопад экскурсия",
              "Новый Афон экскурсия",
              "Святыни Абхазии экскурсия",
              "Илор Каманы Дранда",
              "Абхазия джиппинг",
              "Гагра экскурсия завтра",
              "Пицунда экскурсия завтра",
              "Сухум экскурсия завтра",
              "Абхазия нужен трансфер",
              "Абхазия нужна машина",
              "Абхазия как добраться",
              "Абхазия как доехать",
              "Абхазия как уехать",
              "Псоу Гагра такси",
              "Псоу Пицунда такси",
              "Псоу Сухум такси",
              "Псоу как добраться",
              "Псоу маршрутки",
              "Абхазия рейс перенесли",
              "Абхазия рейс задержали",
              "Абхазия прилетаю ночью",
              "Абхазия поздний прилет",
              "аэропорт Сочи Абхазия трансфер",
              "аэропорт Сочи Гагра",
              "аэропорт Сочи Пицунда",
              "аэропорт Сочи Сухум",
              "Сочи Гагра трансфер",
              "Сочи Абхазия как добраться",
              "Адлер Абхазия трансфер",
              "Красная Поляна Абхазия",
              "Абхазия попутчики",
              "Сухум Гагра сколько",
              "Сухум Гагра как добраться",
              "Гагра Сухум как добраться",
              "Гагра Пицунда как добраться",
          ]

          async def main():
              client=TelegramClient(
                  StringSession(os.environ["TG_SESSION"]),
                  int(os.environ["TG_API_ID"]),
                  os.environ["TG_API_HASH"],
              )
              await client.connect()
              chats={}
              total_messages=0
              flood_waits=[]

              try:
                  for query in QUERIES:
                      try:
                          async for msg in client.iter_messages(None, search=query, limit=90):
                              total_messages += 1
                              chat = await msg.get_chat()
                              if not chat:
                                  continue
                              username=(getattr(chat,"username",None) or "").strip()
                              title=(getattr(chat,"title",None) or "").strip()
                              if not username or not title:
                                  continue
                              if getattr(chat,"broadcast",False):
                                  continue

                              key=username.lower()
                              rec=chats.setdefault(key,{
                                  "username":username,
                                  "title":title,
                                  "queries":set(),
                                  "messages":0,
                                  "classified_direct":0,
                                  "classified_transfer":0,
                                  "classified_excursion":0,
                                  "filtered_seller":0,
                                  "filtered_other":0,
                              })
                              rec["queries"].add(query)
                              rec["messages"] += 1

                              text=(getattr(msg,"message",None) or "").strip()
                              if not text:
                                  continue
                              result,reason=lead_bot.classify_lead_detailed(
                                  text,
                                  source_context=f"GLOBAL:{title} (@{username})",
                              )
                              if result:
                                  rec["classified_direct"] += 1
                                  if result.get("lead_type")=="transfer":
                                      rec["classified_transfer"] += 1
                                  elif result.get("lead_type")=="excursion":
                                      rec["classified_excursion"] += 1
                              elif reason=="seller_or_ad":
                                  rec["filtered_seller"] += 1
                              else:
                                  rec["filtered_other"] += 1
                      except FloodWaitError as exc:
                          flood_waits.append(exc.seconds)
                          if exc.seconds > 90:
                              break
                          await asyncio.sleep(exc.seconds+1)
                      except Exception:
                          continue
                      await asyncio.sleep(0.18)

                  rows=[]
                  for rec in chats.values():
                      rec["queries"]=sorted(rec["queries"])
                      rec["score"]=(
                          rec["classified_direct"]*12
                          + rec["classified_excursion"]*4
                          + rec["classified_transfer"]*3
                          + min(len(rec["queries"]),10)*2
                          - rec["filtered_seller"]*3
                      )
                      rows.append(rec)

                  rows.sort(
                      key=lambda x:(x["score"],x["classified_direct"],x["messages"]),
                      reverse=True,
                  )
                  report={
                      "query_count":len(QUERIES),
                      "total_messages_seen":total_messages,
                      "unique_public_groups":len(rows),
                      "flood_waits":flood_waits,
                      "groups":rows[:180],
                  }
                  Path(".ci-status").mkdir(exist_ok=True)
                  Path(".ci-status/deep-global-message-survey.json").write_text(
                      json.dumps(report,ensure_ascii=False,indent=2),
                      encoding="utf-8",
                  )
              finally:
                  await client.disconnect()

          asyncio.run(main())
          PY
      - name: Publish survey result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-status/deep-global-message-survey.json
          git commit -m "Record deep global Telegram message survey" || exit 0
          git push
