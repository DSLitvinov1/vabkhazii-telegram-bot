name: Inspect TravelAsk Message

on:
  push:
    paths:
      - ".github/workflows/inspect-travelask-message.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore encrypted Telegram session
        uses: actions/cache/restore@v4
        with:
          path: .tg_session_cache
          key: inspect-travelask-${{ github.run_id }}
          restore-keys: |
            vabkhazii-tg-session-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet telethon pynacl
      - name: Resolve Telegram session
        env:
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          TG_SESSION_FALLBACK: ${{ secrets.TG_SESSION }}
        run: python resolve_tg_session.py
      - name: Inspect message
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          LEADS_CHAT_ID: ${{ secrets.LEADS_CHAT_ID }}
        run: |
          python - <<'PY'
          import asyncio, os
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          import lead_bot

          async def main():
              client=TelegramClient(StringSession(os.environ["TG_SESSION"]), int(os.environ["TG_API_ID"]), os.environ["TG_API_HASH"])
              await client.connect()
              try:
                  entity=await client.get_entity("abhazia_hotels_travelask")
                  print("TITLE=",getattr(entity,"title",""))
                  print("USERNAME=",getattr(entity,"username",""))
                  print("JOINED_SELECTED=",lead_bot.is_joined_tourist_chat(entity))
                  count=0
                  async for m in client.iter_messages(entity, reply_to=2267, limit=120):
                      text=lead_bot.normalize(getattr(m,"message",""))
                      if not text:
                          continue
                      low=text.casefold()
                      if not any(k in low for k in ["ноч", "рейс", "добират", "аквафон", "трансфер", "водитель", "цена"]):
                          continue
                      count += 1
                      c,reason=lead_bot.classify_lead_detailed(text,source_context="MY:Отзывы об отелях Абхазии (@abhazia_hotels_travelask) TOPIC:Пансионат Нарт Гагра")
                      print("ID=",getattr(m,"id",None))
                      print("TEXT=",text.replace("\n"," | "))
                      print("CLASS=",c)
                      print("REASON=",reason)
                      print("REPLY_TO=",getattr(m,"reply_to_msg_id",None))
                      print("TOP_ID=",getattr(getattr(m,"reply_to",None),"reply_to_top_id",None))
                      print("---")
                      if count>=20:
                          break
                  print("MATCHES=",count)
              finally:
                  await client.disconnect()
          asyncio.run(main())
          PY
