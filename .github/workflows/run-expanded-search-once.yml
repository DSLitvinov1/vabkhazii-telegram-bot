name: Run Expanded Search Once

on:
  push:
    paths:
      - ".github/workflows/run-expanded-search-once.yml"

permissions:
  contents: read

concurrency:
  group: vabkhazii-telegram-user-session
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .lead_state
          key: expanded-search-${{ github.run_id }}
          restore-keys: |
            vabkhazii-travel-leads-
            vabkhazii-leads-
      - uses: actions/cache/restore@v4
        with:
          path: .tg_session_cache
          key: expanded-session-${{ github.run_id }}
          restore-keys: |
            vabkhazii-tg-session-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet telethon pynacl
      - name: Resolve Telegram session
        env:
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          TG_SESSION_FALLBACK: ${{ secrets.TG_SESSION }}
        run: python resolve_tg_session.py
      - name: Run regression tests
        env:
          LEADS_UNIT_TEST: "1"
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run expanded live search
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          LEADS_CHAT_ID: ${{ secrets.LEADS_CHAT_ID }}
        run: python lead_bot.py
      - name: Persist lead state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lead_state
          key: vabkhazii-travel-leads-${{ github.run_id }}
