name: Stop VAbkhazii Session Renewal

on:
  push:
    paths:
      - ".github/workflows/stop-vabkhazii-session-renewal.yml"

permissions:
  actions: write
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel active VAbkhazii session renewal runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for STATUS in in_progress queued; do
            gh run list               --repo "$GH_REPO"               --workflow renew-vabkhazii-session.yml               --status "$STATUS"               --json databaseId               --jq '.[].databaseId' | while read RUN_ID; do
                [ -z "$RUN_ID" ] || gh run cancel "$RUN_ID" --repo "$GH_REPO" || true
              done
          done
