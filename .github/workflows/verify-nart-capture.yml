name: Verify Nart Lead Capture

on:
  push:
    paths:
      - ".github/workflows/verify-nart-capture.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore leads history
        uses: actions/cache/restore@v4
        with:
          path: .lead_state
          key: verify-nart-${{ github.run_id }}
          restore-keys: |
            vabkhazii-travel-leads-
      - name: Verify message acknowledgement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path(".lead_state/state.json")
          state=json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
          seen=[str(x) for x in state.get("seen",[])]
          print("MESSAGE_488130_SEEN=", any(x.endswith(":488130") for x in seen))
          print("MESSAGE_488009_SEEN=", any(x.endswith(":488009") for x in seen))
          PY
