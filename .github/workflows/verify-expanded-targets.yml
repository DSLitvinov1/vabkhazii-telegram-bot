name: Verify Expanded Targets

on:
  push:
    paths:
      - ".github/workflows/verify-expanded-targets.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .tg_session_cache
          key: verify-expanded-targets-${{ github.run_id }}
          restore-keys: |
            vabkhazii-tg-session-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet telethon pynacl
      - name: Resolve Telegram session
        env:
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          TG_SESSION_FALLBACK: ${{ secrets.TG_SESSION }}
        run: python resolve_tg_session.py
      - name: Verify configured target chats
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          LEADS_CHAT_ID: ${{ secrets.LEADS_CHAT_ID }}
        run: |
          python - <<'PY'
          import asyncio, os
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          import lead_bot

          async def main():
              client=TelegramClient(
                  StringSession(os.environ["TG_SESSION"]),
                  int(os.environ["TG_API_ID"]),
                  os.environ["TG_API_HASH"],
              )
              await client.connect()
              ok=[]
              bad=[]
              try:
                  for ref in lead_bot.TARGET_CHATS:
                      try:
                          entity=await client.get_entity(ref)
                          if getattr(entity,"broadcast",False):
                              bad.append((ref,"broadcast"))
                              continue
                          ok.append((ref,getattr(entity,"title","")))
                      except Exception as exc:
                          bad.append((ref,type(exc).__name__))
                  print("TARGET_TOTAL=",len(lead_bot.TARGET_CHATS))
                  print("TARGET_ACCESSIBLE=",len(ok))
                  print("TARGET_UNAVAILABLE=",len(bad))
                  for ref,title in ok:
                      print("OK",ref,"|",title)
                  for ref,reason in bad:
                      print("BAD",ref,"|",reason)
              finally:
                  await client.disconnect()
          asyncio.run(main())
          PY
