name: Daily VAbkhazii Telegram post

on:
  schedule:
    - cron: '7 9 * * *'
      timezone: 'Europe/Moscow'
    - cron: '7 19 * * *'
      timezone: 'Europe/Moscow'

  workflow_dispatch:
    inputs:
      post_mode:
        description: 'Какой пост отправить'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish daily post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: '@VAbkhazii'
          POST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.post_mode || 'auto' }}
        run: python bot.py
