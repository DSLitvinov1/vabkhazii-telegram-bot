name: VAbkhazii Daily Post

on:
  schedule:
    - cron: '0 6 * * 1,4'
    - cron: '0 6 * * 2,5'
  workflow_dispatch:
    inputs:
      post_mode:
        description: "Тип публикации"
        required: false
        default: "morning"
        type: choice
        options:
          - morning
          - evening
          - news

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Download bot
        uses: actions/checkout@v4

      - name: Restore content history
        uses: actions/cache@v4
        with:
          path: .bot_state
          key: vabkhazii-state-${{ github.run_id }}
          restore-keys: |
            vabkhazii-state-

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python code
        run: python -m py_compile bot.py

      - name: Publish Telegram post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@VAbkhazii"
          POST_MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 6 * * 2,5' && 'news' || 'morning') || inputs.post_mode || 'morning' }}
        run: python bot.py
