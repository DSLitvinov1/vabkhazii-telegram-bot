name: Daily VAbkhazii Telegram post

on:
  workflow_dispatch:
    inputs:
      post_mode:
        description: "Какой пост отправить"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - evening

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Download bot
        uses: actions/checkout@v4

      - name: Restore content history
        uses: actions/cache@v4
        with:
          path: .bot_state
          key: vabkhazii-state-${{ github.run_id }}
          restore-keys: |
            vabkhazii-state-

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python code
        run: python -m py_compile bot.py

      - name: Publish Telegram post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@VAbkhazii"
          POST_MODE: ${{ inputs.post_mode }}
        run: python bot.py
