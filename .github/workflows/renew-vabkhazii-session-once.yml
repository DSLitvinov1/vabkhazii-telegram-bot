name: Renew VAbkhazii Session Once
# one-shot-rerun: 1791831602477

on:
  push:
    paths:
      - ".github/workflows/renew-vabkhazii-session-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vabkhazii-session-renewal-once
  cancel-in-progress: false

jobs:
  renew-and-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Restore leads history
        uses: actions/cache/restore@v4
        with:
          path: .lead_state
          key: vabkhazii-travel-leads-renew-${{ github.run_id }}
          restore-keys: |
            vabkhazii-travel-leads-
            vabkhazii-leads-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet telethon pynacl requests "qrcode[pil]"

      - name: Create one fresh Telegram user session
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          LEADS_CHAT_ID: ${{ secrets.LEADS_CHAT_ID }}
          TG_2FA_PASSWORD: ${{ secrets.TG_2FA_PASSWORD }}
          SINGLE_QR: "1"
        run: python renew_vabkhazii_session.py

      - name: Read renewal status
        id: auth
        run: |
          STATUS="$(head -n 1 .ci-status/vabkhazii-session-renew.txt 2>/dev/null || true)"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = "AUTHORIZED" ] && [ -s .tg_session_cache/session.enc ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist encrypted Telegram session
        if: steps.auth.outputs.authorized == 'true'
        uses: actions/cache/save@v4
        with:
          path: .tg_session_cache
          key: vabkhazii-tg-session-${{ github.run_id }}

      - name: Resolve fresh Telegram session
        if: steps.auth.outputs.authorized == 'true'
        env:
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          TG_SESSION_FALLBACK: ""
        run: python resolve_tg_session.py

      - name: Run regression tests
        id: tests
        if: steps.auth.outputs.authorized == 'true'
        continue-on-error: true
        env:
          LEADS_UNIT_TEST: "1"
        run: |
          python -m py_compile lead_bot.py tg_session_cache.py resolve_tg_session.py renew_vabkhazii_session.py
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Restart VAbkhazii Leads Bot
        id: bot
        if: steps.auth.outputs.authorized == 'true' && steps.tests.outcome == 'success'
        continue-on-error: true
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          LEADS_CHAT_ID: ${{ secrets.LEADS_CHAT_ID }}
        run: python lead_bot.py

      - name: Persist leads history
        if: steps.auth.outputs.authorized == 'true' && steps.bot.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .lead_state
          key: vabkhazii-travel-leads-${{ github.run_id }}

      - name: Publish safe result
        if: always()
        run: |
          {
            echo "tests=${{ steps.tests.outcome }}"
            echo "bot=${{ steps.bot.outcome }}"
          } >> .ci-status/vabkhazii-session-renew.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-status/vabkhazii-session-renew.txt
          git commit -m "Record VAbkhazii recovery result" || exit 0
          git push

      - name: Confirm restored bot
        if: steps.auth.outputs.authorized == 'true' && steps.tests.outcome == 'success' && steps.bot.outcome == 'success'
        env:
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          LEADS_CHAT_ID: ${{ secrets.LEADS_CHAT_ID }}
        run: |
          curl --silent --show-error --fail-with-body --request POST             "https://api.telegram.org/bot$LEADS_BOT_TOKEN/sendMessage"             --data-urlencode "chat_id=$LEADS_CHAT_ID"             --data-urlencode "text=✅ VAbkhazii Leads восстановлен: Telegram-поиск активен, тесты пройдены, бот перезапущен."
