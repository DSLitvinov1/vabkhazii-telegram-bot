name: Deep Telegram Survey

on:
  push:
    paths:
      - ".github/workflows/deep-telegram-survey.yml"

permissions:
  contents: write

concurrency:
  group: vabkhazii-deep-telegram-survey
  cancel-in-progress: true

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Restore encrypted Telegram session
        uses: actions/cache/restore@v4
        with:
          path: .tg_session_cache
          key: deep-survey-${{ github.run_id }}
          restore-keys: |
            vabkhazii-tg-session-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --quiet telethon pynacl

      - name: Resolve Telegram session
        env:
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          TG_SESSION_FALLBACK: ${{ secrets.TG_SESSION }}
        run: python resolve_tg_session.py

      - name: Survey Telegram public groups
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          LEADS_CHAT_ID: ${{ secrets.LEADS_CHAT_ID }}
        run: |
          python - <<'PY'
          import asyncio
          import json
          import os
          from collections import defaultdict
          from pathlib import Path

          from telethon import TelegramClient
          from telethon.errors import FloodWaitError
          from telethon.tl.functions.contacts import SearchRequest
          from telethon.sessions import StringSession

          QUERIES = [
              "Абхазия чат", "Абхазия туристы", "Абхазия отдых", "Абхазия путешествия",
              "Абхазия форум", "Абхазия вопросы", "Абхазия отзывы", "Абхазия туристический чат",
              "Абхазия попутчики", "Абхазия поездки", "Абхазия путешественники",
              "Абхазия отели чат", "Абхазия гостиницы чат", "Отзывы об отелях Абхазии",
              "Гагра чат", "Гагра туристы", "Гагра отдых", "Гагра отзывы", "Гагра отели чат",
              "Пицунда чат", "Пицунда туристы", "Пицунда отдых", "Пицунда отзывы",
              "Сухум чат", "Сухум туристы", "Сухум отдых", "Сухум отзывы",
              "Новый Афон чат", "Новый Афон туристы", "Гудаута чат", "Цандрипш чат",
              "Псоу чат", "Псоу поездки", "Псоу такси", "граница Псоу чат",
              "Абхазия экскурсии чат", "Абхазия гид чат", "Абхазия джиппинг чат",
              "Гагра экскурсии чат", "Пицунда экскурсии чат", "Сухум экскурсии чат",
              "Рица чат", "Рица поездки", "Рица экскурсии", "Мзы чат", "Мзы экскурсии",
              "Акармара чат", "Акармара экскурсии", "Восточная Абхазия чат",
              "Новый Афон экскурсии чат", "Святыни Абхазии чат", "Кындыг чат",
              "Абхазия трансфер чат", "Абхазия такси чат", "Абхазия транспорт чат",
              "Сухум Гагра поездки", "Сочи Абхазия чат", "Адлер Абхазия чат",
              "аэропорт Сочи Абхазия", "Сириус Абхазия чат", "Красная Поляна Абхазия чат",
              "попутчики Сочи Абхазия", "такси Псоу Гагра", "такси Псоу Сухум",
              "Абхазия с детьми чат", "семейный отдых Абхазия чат", "мамы Абхазия отдых",
              "отдых с детьми Гагра чат", "отдых с детьми Пицунда чат",
              "Москва Абхазия путешествия", "Краснодар Абхазия путешествия",
              "Ростов Абхазия путешествия", "Беларусь Абхазия путешествия",
              "Казахстан Абхазия путешествия", "Армения Абхазия путешествия",
              "TravelAsk Абхазия", "AMRA Абхазия", "Абхазия travel chat",
              "Abkhazia chat", "Gagra chat", "Sukhum chat", "Pitsunda chat",
          ]

          BUYER_MARKERS = [
              "нуж", "ищу", "ищем", "подскаж", "посовет", "порекоменду",
              "кто может", "кто возит", "кто отвез", "кто довез", "кто забер",
              "куда съезд", "куда поех", "что посмотр", "как добрат", "как доех",
              "как уехать", "как добират", "сколько стоит", "цена", "стоимость",
              "прилета", "рейс перен", "рейс задерж", "ночью", "маршрутки",
          ]
          EXCURSION_MARKERS = [
              "экскурс", "гид", "рица", "мзы", "акармар", "ткуарчал",
              "новый афон", "джипп", "водопад", "черниговк", "кындыг",
              "святын", "илор", "дранд", "каман", "куда съезд", "что посмотр",
          ]
          TRANSFER_MARKERS = [
              "трансфер", "такси", "машин", "водител", "псоу", "аэропорт",
              "вокзал", "доех", "добрат", "уехать", "рейс", "маршрутк",
          ]
          SELLER_MARKERS = [
              "брониру", "запись", "наши экскурсии", "провожу экскурсии",
              "организуем экскурсии", "предлагаем экскурсии", "предлагаю экскурсии",
              "трансферы по абхазии", "пишите в личку", "места ограничены",
              "туроператор", "турагентство", "наш автопарк",
          ]

          async def main():
              client = TelegramClient(
                  StringSession(os.environ["TG_SESSION"]),
                  int(os.environ["TG_API_ID"]),
                  os.environ["TG_API_HASH"],
              )
              await client.connect()
              found = {}
              hits_by_query = {}
              flood_waits = []

              try:
                  for index, query in enumerate(QUERIES, 1):
                      try:
                          result = await client(SearchRequest(q=query, limit=50))
                      except FloodWaitError as exc:
                          flood_waits.append(exc.seconds)
                          if exc.seconds > 90:
                              break
                          await asyncio.sleep(exc.seconds + 1)
                          continue
                      except Exception:
                          continue

                      query_hits = 0
                      for chat in getattr(result, "chats", []) or []:
                          username = (getattr(chat, "username", None) or "").strip()
                          title = (getattr(chat, "title", None) or "").strip()
                          if not username or not title:
                              continue
                          if getattr(chat, "broadcast", False):
                              continue
                          if not getattr(chat, "megagroup", False):
                              continue

                          key = username.lower()
                          rec = found.setdefault(key, {
                              "username": username,
                              "title": title,
                              "queries": [],
                              "participants_count": int(getattr(chat, "participants_count", 0) or 0),
                              "buyer_hits": 0,
                              "excursion_hits": 0,
                              "transfer_hits": 0,
                              "seller_hits": 0,
                              "recent_scanned": 0,
                          })
                          rec["queries"].append(query)
                          rec["participants_count"] = max(
                              rec["participants_count"],
                              int(getattr(chat, "participants_count", 0) or 0),
                          )
                          query_hits += 1
                      hits_by_query[query] = query_hits
                      await asyncio.sleep(0.15)

                  def source_score(rec):
                      title = rec["title"].lower()
                      query_blob = " ".join(rec["queries"]).lower()
                      score = len(set(rec["queries"])) * 3
                      if any(x in title for x in ["абхаз", "гагра", "пицунд", "сухум", "афон", "псоу", "рица"]):
                          score += 12
                      if any(x in query_blob for x in ["экскурс", "попут", "турист", "отдых", "отел"]):
                          score += 5
                      score += min(rec["participants_count"] // 500, 10)
                      return score

                  candidates = sorted(found.values(), key=source_score, reverse=True)[:140]

                  for rec in candidates:
                      try:
                          entity = await client.get_entity(rec["username"])
                          async for msg in client.iter_messages(entity, limit=100):
                              text = (getattr(msg, "message", None) or "").strip().lower()
                              if not text:
                                  continue
                              rec["recent_scanned"] += 1
                              if any(m in text for m in BUYER_MARKERS):
                                  rec["buyer_hits"] += 1
                              if any(m in text for m in EXCURSION_MARKERS):
                                  rec["excursion_hits"] += 1
                              if any(m in text for m in TRANSFER_MARKERS):
                                  rec["transfer_hits"] += 1
                              if any(m in text for m in SELLER_MARKERS):
                                  rec["seller_hits"] += 1
                      except FloodWaitError as exc:
                          flood_waits.append(exc.seconds)
                          if exc.seconds <= 60:
                              await asyncio.sleep(exc.seconds + 1)
                          else:
                              break
                      except Exception:
                          continue

                  ranked = sorted(
                      candidates,
                      key=lambda r: (
                          (r["buyer_hits"] * 5)
                          + (r["excursion_hits"] * 2)
                          + (r["transfer_hits"] * 2)
                          + len(set(r["queries"])) * 3
                          - (r["seller_hits"] * 2)
                      ),
                      reverse=True,
                  )

                  report = {
                      "query_count": len(QUERIES),
                      "groups_found": len(found),
                      "groups_scanned": len(candidates),
                      "flood_waits": flood_waits,
                      "top_groups": ranked[:100],
                      "query_hits": hits_by_query,
                  }
                  Path(".ci-status").mkdir(exist_ok=True)
                  Path(".ci-status/deep-telegram-survey.json").write_text(
                      json.dumps(report, ensure_ascii=False, indent=2),
                      encoding="utf-8",
                  )
              finally:
                  await client.disconnect()

          asyncio.run(main())
          PY

      - name: Publish survey result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-status/deep-telegram-survey.json
          git commit -m "Record deep Telegram source survey" || exit 0
          git push
