name: Renew LogoLead Telegram Session

on:
  workflow_dispatch:
    inputs:
      encryption_public_key:
        description: "One-time public encryption key held by session owner"
        required: true

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: logolead-account-authorization
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "telethon>=1.36,<2" "qrcode[pil]" pynacl requests
      - name: Create new Telegram session
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LOGOLEAD_BOT_TOKEN: ${{ secrets.LOGOLEAD_BOT_TOKEN }}
          LOGOLEAD_CHAT_ID: ${{ secrets.LOGOLEAD_CHAT_ID }}
          LOGOLEAD_TG_2FA_PASSWORD: ${{ secrets.LOGOLEAD_TG_2FA_PASSWORD }}
          ENCRYPTION_PUBLIC_KEY: ${{ inputs.encryption_public_key }}
        run: python logolead/renew_session.py
