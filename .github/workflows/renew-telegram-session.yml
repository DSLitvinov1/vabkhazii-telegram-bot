name: Renew Telegram Session

on:
  workflow_dispatch:
    inputs:
      encryption_public_key:
        description: "One-time public key"
        required: true

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: telegram-user-session
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "telethon>=1.36,<2" "qrcode[pil]" pynacl requests
      - name: Create new Telegram session
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          LEADS_CHAT_ID: ${{ secrets.LEADS_CHAT_ID }}
          ENCRYPTION_PUBLIC_KEY: ${{ inputs.encryption_public_key }}
        run: python logolead/renew_session.py
