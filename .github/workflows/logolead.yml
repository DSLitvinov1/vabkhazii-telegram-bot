name: LogoLead

on:
  push:
    paths:
      - "logolead/**"
      - ".github/workflows/logolead.yml"
      - ".github/workflows/check-logolead-target.yml"
  workflow_dispatch:
    inputs:
      force_logolead:
        description: "Force LogoLead scan now"
        required: false
        default: "0"
      deliver:
        description: "Send found leads during this manual run"
        required: false
        default: "0"
      min_score:
        description: "Minimum lead score"
        required: false
        default: "50"

permissions:
  contents: read
  statuses: write

jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: telegram-user-session
      cancel-in-progress: false
    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Restore LogoLead state
        if: github.event_name != 'push'
        uses: actions/cache@v6
        with:
          path: logolead/.lead_state
          key: logolead-${{ github.run_id }}
          restore-keys: |
            logolead-
            vabkhazii-leads-

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "logolead/requirements.txt"

      - name: Install dependencies
        run: pip install -r logolead/requirements.txt

      - name: Test LogoLead
        if: github.event_name != 'schedule'
        working-directory: logolead
        run: |
          python -m py_compile lead_bot.py classifier.py reply.py card.py sources.py web_sources.py market_sources.py target_ready.py
          python test_reply.py
          python test_classifier.py
          python test_quality.py
          python test_web.py
          python test_market.py
          python test_notify.py
          python test_feedback.py
          python test_pipeline.py
          python test_config.py
          python test_chat_filter.py
          python test_pending.py
          python test_state.py
          python test_sources.py
          python test_workflow.py
          python test_target.py
          python test_full.py

      - name: Run LogoLead
        if: github.event_name != 'push'
        working-directory: logolead
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          LOGOLEAD_BOT_TOKEN: ${{ secrets.LOGOLEAD_BOT_TOKEN }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          LOGOLEAD_CHAT_ID: ${{ secrets.LOGOLEAD_CHAT_ID }}
          MIN_SCORE: ${{ inputs.min_score || '50' }}
          MAX_AGE_HOURS: "72"
          GLOBAL_ROTATING_QUERIES_PER_RUN: "12"
          MAX_LEADS_PER_RUN: "1"
          DELIVERY_MAX_AGE_HOURS: "24"
          PENDING_LIMIT: "500"
          DELIVERY_ENABLED: ${{ github.event_name == 'schedule' && '1' || (inputs.deliver || '0') }}
          ENABLE_FEEDBACK: "0"
          RUN_INTERVAL_MINUTES: "10"
          FORCE_RUN: ${{ inputs.force_logolead || '0' }}
          DISCOVERY_INTERVAL_MINUTES: "360"
          DISCOVERY_ROTATING_QUERIES_PER_REFRESH: "18"
          MAX_DISCOVERED_GROUPS: "30"
          GROUP_CACHE_LIMIT: "120"
          GROUP_SCAN_LIMIT: "80"
          INITIAL_GROUP_SCAN_LIMIT: "180"
          BACKFILL_GROUPS_PER_RUN: "1"
          BACKFILL_SCAN_LIMIT: "120"
          DEEP_GROUP_INTERVAL_MINUTES: "180"
          DEEP_GROUP_SCAN_COUNT: "6"
          DEEP_GROUP_SEARCH_LIMIT: "15"
          ENABLE_MARKETS: "1"
          ENABLE_KWORK: "1"
          ENABLE_PROFI: "1"
          MARKET_INTERVAL_MINUTES: "30"
          ENABLE_WEB: "1"
          WEB_INTERVAL_MINUTES: "60"
          SEND_STATUS: "0"
          STATUS_INTERVAL_HOURS: "24"
          BOT_SEND_RETRIES: "2"
          BOT_RETRY_MAX_SECONDS: "30"
          DISPLAY_TZ_OFFSET: "3"
        run: python lead_bot.py

      - name: Publish LogoLead status
        if: always()
        env:
          CI_STATE: ${{ job.status }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          state='success' if os.environ.get('CI_STATE')=='success' else 'failure'
          payload=json.dumps({
              'state':state,
              'context':'logolead/tests',
              'description':'LogoLead workflow '+state,
          }).encode()
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json',
                  'Content-Type':'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(req,timeout=20) as response:
              print('STATUS_HTTP',response.status)
          PY
