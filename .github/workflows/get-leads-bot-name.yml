name: Get Leads Bot Name

on:
  workflow_dispatch:

jobs:
  identify:
    runs-on: ubuntu-latest
    steps:
      - name: Identify Telegram bot
        env:
          BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ['BOT_TOKEN']
          with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe',timeout=20) as r:
              data=json.load(r)
          result=data.get('result') or {}
          print('BOT_USERNAME=@'+str(result.get('username') or 'unknown'))
          print('BOT_NAME='+str(result.get('first_name') or 'unknown'))
          PY
