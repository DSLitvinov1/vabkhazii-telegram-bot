name: VAbkhazii Leads Bot

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vabkhazii-telegram-user-session
  cancel-in-progress: false

jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Restore leads history
        uses: actions/cache@v4
        with:
          path: .lead_state
          key: vabkhazii-travel-leads-${{ github.run_id }}
          restore-keys: |
            vabkhazii-travel-leads-
            vabkhazii-leads-

      - name: Restore encrypted Telegram session
        uses: actions/cache/restore@v4
        with:
          path: .tg_session_cache
          key: vabkhazii-tg-session-${{ github.run_id }}
          restore-keys: |
            vabkhazii-tg-session-

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install telethon pynacl

      - name: Validate required secrets
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          LEADS_CHAT_ID: ${{ secrets.LEADS_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import sys

          names = [
              "TG_API_ID",
              "TG_API_HASH",
              "LEADS_BOT_TOKEN",
              "LEADS_CHAT_ID",
          ]
          missing = [name for name in names if not os.environ.get(name, "").strip()]
          if missing:
              print("Missing secrets:", ", ".join(missing))
              sys.exit(1)

          if not os.environ["TG_API_ID"].strip().isdigit():
              print("TG_API_ID must contain digits only")
              sys.exit(1)

          print("Required non-session secrets are present")
          print("TG_API_ID format OK")
          PY

      - name: Resolve Telegram user session
        env:
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          TG_SESSION_FALLBACK: ${{ secrets.TG_SESSION }}
        run: python resolve_tg_session.py

      - name: Check VAbkhazii lead bot syntax
        run: python -m py_compile lead_bot.py

      - name: Run lead-quality regression tests
        env:
          LEADS_UNIT_TEST: "1"
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run VAbkhazii Leads Bot
        if: github.event_name != 'push'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          LEADS_CHAT_ID: ${{ secrets.LEADS_CHAT_ID }}
        run: python lead_bot.py

      - name: Telegram alert if bot failed
        if: failure() && github.event_name == 'schedule' && github.event_name != 'push'
        continue-on-error: true
        env:
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          LEADS_CHAT_ID: ${{ secrets.LEADS_CHAT_ID }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$LEADS_BOT_TOKEN" ] || [ -z "$LEADS_CHAT_ID" ]; then
            echo "Telegram failure alert skipped: missing bot token or chat id"
            exit 0
          fi

          # Production runs happen once per hour, so one alert per failed run
          # is already the maximum notification rate.
          MESSAGE="⚠️ VAbkhazii Leads Bot остановился с ошибкой.
          Запуск: #$RUN_NUMBER
          Проверь GitHub Actions:
          $RUN_URL"
          if ! curl --silent --show-error --fail-with-body --request POST "https://api.telegram.org/bot$LEADS_BOT_TOKEN/sendMessage" --data-urlencode "chat_id=$LEADS_CHAT_ID" --data-urlencode "text=$MESSAGE"; then
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ "$TELEGRAM_BOT_TOKEN" != "$LEADS_BOT_TOKEN" ]; then
              echo "Primary alert bot failed; trying fallback bot"
              curl --silent --show-error --fail-with-body --request POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" --data-urlencode "chat_id=$LEADS_CHAT_ID" --data-urlencode "text=$MESSAGE"
            else
              exit 1
            fi
          fi
