name: VAbkhazii Leads Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: telegram-user-session
      cancel-in-progress: false
    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Restore leads history
        uses: actions/cache@v6
        with:
          path: .lead_state
          key: vabkhazii-travel-leads-${{ github.run_id }}
          restore-keys: |
            vabkhazii-travel-leads-
            vabkhazii-leads-

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon

      - name: Check VAbkhazii lead bot syntax
        run: python -m py_compile lead_bot.py

      - name: Run VAbkhazii Leads Bot
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          LEADS_CHAT_ID: ${{ secrets.LEADS_CHAT_ID }}
        run: python lead_bot.py
