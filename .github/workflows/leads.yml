name: VAbkhazii Leads Bot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vabkhazii-leads-production
  cancel-in-progress: false

jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Restore leads history
        uses: actions/cache@v6
        with:
          path: .lead_state
          key: vabkhazii-travel-leads-${{ github.run_id }}
          restore-keys: |
            vabkhazii-travel-leads-
            vabkhazii-leads-

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install telethon

      - name: Validate required secrets
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          LEADS_CHAT_ID: ${{ secrets.LEADS_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import sys

          names = [
              "TG_API_ID",
              "TG_API_HASH",
              "TG_SESSION",
              "LEADS_BOT_TOKEN",
              "LEADS_CHAT_ID",
          ]
          missing = [name for name in names if not os.environ.get(name, "").strip()]
          if missing:
              print("Missing secrets:", ", ".join(missing))
              sys.exit(1)

          api_id = os.environ["TG_API_ID"].strip()
          if not api_id.isdigit():
              print("TG_API_ID must contain digits only")
              sys.exit(1)

          print("Required secrets are present")
          print("TG_API_ID format OK")
          print("TG_SESSION length:", len(os.environ["TG_SESSION"].strip()))
          PY

      - name: Check VAbkhazii lead bot syntax
        run: python -m py_compile lead_bot.py

      - name: Run VAbkhazii Leads Bot
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          LEADS_CHAT_ID: ${{ secrets.LEADS_CHAT_ID }}
        run: python lead_bot.py

      - name: Telegram alert if bot failed
        if: failure()
        continue-on-error: true
        env:
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          LEADS_CHAT_ID: ${{ secrets.LEADS_CHAT_ID }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$LEADS_BOT_TOKEN" ] || [ -z "$LEADS_CHAT_ID" ]; then
            echo "Telegram failure alert skipped: missing bot token or chat id"
            exit 0
          fi
          MESSAGE="⚠️ VAbkhazii Leads Bot остановился с ошибкой.
          Запуск: #$RUN_NUMBER
          Проверь GitHub Actions:
          $RUN_URL"
          curl --silent --show-error --fail-with-body --request POST "https://api.telegram.org/bot$LEADS_BOT_TOKEN/sendMessage" --data-urlencode "chat_id=$LEADS_CHAT_ID" --data-urlencode "text=$MESSAGE"
