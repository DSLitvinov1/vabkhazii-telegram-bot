name: VAbkhazii Leads Bot

on:
  workflow_dispatch:
    inputs:
      force_logolead:
        description: "Force LogoLead scan now"
        required: false
        default: "0"

  schedule:
    - cron: "*/5 * * * *"

jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: vabkhazii-leads
      cancel-in-progress: false

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Restore leads history
        uses: actions/cache@v4
        with:
          path: |
            .lead_state
            logolead/.lead_state
          key: vabkhazii-leads-${{ github.run_id }}
          restore-keys: |
            vabkhazii-leads-

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon

      - name: Check lead bot syntax
        run: python -m py_compile lead_bot.py

      - name: Run VAbkhazii Leads Bot
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          LEADS_CHAT_ID: ${{ secrets.LEADS_CHAT_ID }}
        run: python lead_bot.py


      - name: Check LogoLead
        working-directory: logolead
        run: |
          python -m py_compile lead_bot.py classifier.py reply.py card.py sources.py web_sources.py
          python test_reply.py
          python test_classifier.py
          python test_web.py
          python test_state.py
          python test_sources.py
          python test_full.py

      - name: Run LogoLead
        working-directory: logolead
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          LEADS_CHAT_ID: ${{ secrets.LEADS_CHAT_ID }}
          MIN_SCORE: "50"
          MAX_AGE_HOURS: "72"
          MAX_LEADS_PER_RUN: "12"
          RUN_INTERVAL_MINUTES: "10"
          FORCE_RUN: ${{ github.event.inputs.force_logolead || '0' }}
          ENABLE_WEB: "0"
          WEB_INTERVAL_MINUTES: "60"
          DISCOVERY_INTERVAL_MINUTES: "360"
          MAX_DISCOVERED_GROUPS: "30"
          GROUP_SCAN_LIMIT: "80"
          INITIAL_GROUP_SCAN_LIMIT: "180"
        run: python lead_bot.py
