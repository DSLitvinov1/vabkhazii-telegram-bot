name: VAbkhazii Telegram Delivery Test

on:
  push:
    paths:
      - ".github/workflows/test-telegram-delivery.yml"

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send test message
        env:
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          LEADS_CHAT_ID: ${{ secrets.LEADS_CHAT_ID }}
        run: |
          set -e
          RESPONSE=$(curl --silent --show-error --fail-with-body --request POST             "https://api.telegram.org/bot$LEADS_BOT_TOKEN/sendMessage"             --data-urlencode "chat_id=$LEADS_CHAT_ID"             --data-urlencode "text=✅ Тест VAbkhazii Leads Bot: бот работает, облачная отправка сообщений подтверждается.")
          export RESPONSE
          python - <<'PY'
          import json, os
          data = json.loads(os.environ["RESPONSE"])
          if not data.get("ok"):
              raise SystemExit("Telegram API returned failure")
          msg_id = data.get("result", {}).get("message_id")
          os.makedirs(".ci-status", exist_ok=True)
          with open(".ci-status/telegram-test.txt", "w", encoding="utf-8") as f:
              f.write(f"PASS\nmessage_id={msg_id}\n")
          print(f"Telegram test delivered, message_id={msg_id}")
          PY

      - name: Record result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-status/telegram-test.txt
          git commit -m "Record Telegram delivery test result" || exit 0
          git push
