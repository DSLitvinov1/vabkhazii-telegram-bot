name: Diagnose Nart Lead Source

on:
  push:
    paths:
      - ".github/workflows/diagnose-nart.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Restore encrypted Telegram session
        uses: actions/cache/restore@v4
        with:
          path: .tg_session_cache
          key: nart-diagnostic-${{ github.run_id }}
          restore-keys: |
            vabkhazii-tg-session-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet telethon pynacl
      - name: Resolve Telegram session
        env:
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          TG_SESSION_FALLBACK: ${{ secrets.TG_SESSION }}
        run: python resolve_tg_session.py
      - name: Diagnose source and matching messages
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          LEADS_BOT_TOKEN: ${{ secrets.LEADS_BOT_TOKEN }}
          LEADS_CHAT_ID: ${{ secrets.LEADS_CHAT_ID }}
        run: |
          python - <<'PY'
          import asyncio, os
          from pathlib import Path
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          import lead_bot

          out=[]

          async def main():
              client=TelegramClient(StringSession(os.environ["TG_SESSION"]), int(os.environ["TG_API_ID"]), os.environ["TG_API_HASH"])
              await client.connect()
              try:
                  me=await client.get_me()
                  out.append(f"account={getattr(me,'first_name','')} {getattr(me,'last_name','') or ''}".strip())
                  found=[]
                  async for d in client.iter_dialogs():
                      ent=getattr(d,"entity",None)
                      title=(getattr(ent,"title",None) or "")
                      if "нарт" in title.casefold():
                          found.append(ent)
                  out.append(f"matching_dialogs={len(found)}")
                  for ent in found:
                      title=(getattr(ent,"title",None) or "")
                      username=(getattr(ent,"username",None) or "")
                      out.append(f"title={title}")
                      out.append(f"username={username}")
                      out.append(f"broadcast={bool(getattr(ent,'broadcast',False))}")
                      out.append(f"megagroup={bool(getattr(ent,'megagroup',False))}")
                      out.append(f"joined_selected={lead_bot.is_joined_tourist_chat(ent)}")
                      hits=0
                      async for m in client.iter_messages(ent, limit=250):
                          text=lead_bot.normalize(getattr(m,"message",""))
                          low=text.casefold()
                          if any(k in low for k in ["ночная цена","рейс перенес","рейс перенёс","добираться"]):
                              hits += 1
                              c,reason=lead_bot.classify_lead_detailed(text,source_context=f"MY:{title} {title}")
                              out.append(f"hit_{hits}_classified={bool(c)}")
                              out.append(f"hit_{hits}_reason={reason or (c or {}).get('lead_type','')}")
                              if hits>=5:
                                  break
                      out.append(f"matching_messages={hits}")
              finally:
                  await client.disconnect()

          asyncio.run(main())
          Path(".ci-status").mkdir(exist_ok=True)
          Path(".ci-status/nart-diagnostic.txt").write_text("\n".join(out)+"\n",encoding="utf-8")
          PY
      - name: Publish safe diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-status/nart-diagnostic.txt
          git commit -m "Record Nart lead diagnostic" || exit 0
          git push
